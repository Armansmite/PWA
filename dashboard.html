<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shorts Bot V5.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase client (UMD build – works everywhere) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #0a0a1a;
      --surface: rgba(20, 20, 40, 0.75);
      --primary: #7c5dfa;
      --primary-hover: #6a4cf0;
      --accent: #00d4aa;
      --danger: #ff4d6a;
      --text: #eaeaea;
      --muted: #a0a0b0;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(145deg, #0a0a1a 0%, #1a0a2e 100%);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
      align-items: flex-start;
    }
    .container {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 30px 18px 25px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      margin: 10px 0;
    }
    h1, h2 { color: var(--text); }
    input, button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: white;
      padding: 12px 14px;
      font-size: 0.95rem;
      width: 100%;
      transition: 0.2s;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,93,250,0.2); }
    button {
      background: var(--primary);
      border: none;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-top: 10px;
    }
    button:hover { background: var(--primary-hover); }
    .auth-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .auth-overlay h2 {
      margin-bottom: 20px;
      background: linear-gradient(135deg, #7c5dfa, #00d4aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }
    .auth-form { width: 100%; max-width: 320px; }
    .auth-form input { margin-bottom: 12px; }
    .auth-buttons { display: flex; gap: 12px; }
    .auth-message { margin-top: 15px; font-size: 0.9rem; }
    .hidden { display: none !important; }
    .spinner { margin: 10px auto; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Login overlay -->
    <div id="auth-overlay" class="auth-overlay">
      <h2>🎬 Shorts Bot</h2>
      <div class="auth-form">
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
        <div class="auth-buttons">
          <button id="login-btn" onclick="login()">Log In</button>
          <button id="signup-btn" onclick="signup()" style="background: var(--accent);">Sign Up</button>
        </div>
        <p id="auth-message" class="auth-message"></p>
      </div>
    </div>

    <!-- Main dashboard (hidden until login) -->
    <div id="main-panel" class="hidden">
      <!-- Here you must paste the complete dashboard HTML you already have:
           tabs, settings panel, auth panel, run panel, export panel, files panel, log panel.
           Make sure every <button> calls the correct JavaScript functions (saveSettings, startBot, etc.)
           I'll include a placeholder message so you know where to insert it. -->
      <h2>Dashboard loaded successfully</h2>
      <p>Insert your dashboard panels here (Settings, Auth, Run, etc.)</p>
      <button onclick="logout()" style="margin-top:20px; background:var(--danger);">Logout</button>
    </div>
  </div>

  <script>
    // Check if Supabase client loaded
    if (typeof window.supabase === 'undefined') {
      document.getElementById('auth-message').textContent = 'Failed to load Supabase library. Please refresh.';
      document.getElementById('login-btn').disabled = true;
      document.getElementById('signup-btn').disabled = true;
    }

    // Supabase configuration
    const SUPABASE_URL = 'https://lotfvavhsbxcyduxmaat.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvdGZ2YXZoc2J4Y3lkdXhtYWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODA4MjEsImV4cCI6MjA5NjY1NjgyMX0.zeZwTDpmv_t0b5f07iOb2SP-c7OO8UoiToaLZFCnDvs';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authToken = null;

    function showMessage(msg, isError = false) {
      const el = document.getElementById('auth-message');
      el.textContent = msg;
      el.style.color = isError ? 'var(--danger)' : 'var(--accent)';
    }

    async function signup() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        showMessage('Please fill in both fields.', true);
        return;
      }
      showMessage(''); // clear previous
      document.getElementById('signup-btn').disabled = true;
      const { data, error } = await supabase.auth.signUp({ email, password });
      document.getElementById('signup-btn').disabled = false;
      if (error) {
        showMessage(error.message, true);
      } else {
        showMessage('✅ Signup successful! You can now log in.');
      }
    }

    async function login() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        showMessage('Please fill in both fields.', true);
        return;
      }
      showMessage('');
      document.getElementById('login-btn').disabled = true;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      document.getElementById('login-btn').disabled = false;
      if (error) {
        showMessage(error.message, true);
      } else {
        authToken = data.session.access_token;
        localStorage.setItem('authToken', authToken);
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('auth-overlay').classList.add('hidden');
      document.getElementById('main-panel').classList.remove('hidden');
      // Here you would call your dashboard init functions (e.g., loadConfigList())
    }

    function logout() {
      authToken = null;
      localStorage.removeItem('authToken');
      document.getElementById('auth-overlay').classList.remove('hidden');
      document.getElementById('main-panel').classList.add('hidden');
      document.getElementById('auth-email').value = '';
      document.getElementById('auth-password').value = '';
      showMessage('');
    }

    // Auto-login if token exists
    (async () => {
      const savedToken = localStorage.getItem('authToken');
      if (savedToken) {
        const { data: { user }, error } = await supabase.auth.getUser(savedToken);
        if (user && !error) {
          authToken = savedToken;
          showDashboard();
        } else {
          localStorage.removeItem('authToken');
        }
      }
    })();

    // API helper – attach auth token automatically
    function apiFetch(url, options = {}) {
      options.headers = options.headers || {};
      if (authToken) options.headers['Authorization'] = 'Bearer ' + authToken;
      return fetch(url, options);
    }

    // ========== INSERT YOUR EXISTING DASHBOARD FUNCTIONS BELOW ==========
    // All your previous functions (switchTab, loadConfigList, renderConfigSettings,
    // saveSettings, startBot, cancelBot, uploadFile, refreshLog, exportConfig, importConfig, etc.)
    // must be copied here.
    // IMPORTANT: replace every `fetch(...)` with `apiFetch(...)` inside those functions.

    // Example stub:
    function loadConfigList() {
      apiFetch('/api/configs')
        .then(r => r.json())
        .then(configs => {
          console.log('Configs loaded:', configs);
          // populate the config dropdown, etc.
        });
    }
  </script>
</body>
</html>
