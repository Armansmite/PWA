<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorts Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #0a0a1a;
      --surface: rgba(20,20,40,0.8);
      --primary: #7c5dfa;
      --accent: #00d4aa;
      --danger: #ff4d6a;
      --text: #eee;
      --muted: #aaa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(145deg, #0a0a1a, #1a0a2e);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1rem;
      min-height: 100vh;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      margin-top: 2rem;
      border: 1px solid rgba(255,255,255,0.08);
    }
    h2 { text-align:center; margin-bottom:1rem; }
    input, button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: white;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }
    button {
      background: var(--primary);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: var(--accent); }
    .hidden { display: none !important; }
    .card {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-red { background: var(--danger); }
    .badge-green { background: var(--accent); }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Login Form -->
    <div id="login-box">
      <h2>🎬 Shorts Bot</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Log In</button>
      <button class="secondary" onclick="signup()">Sign Up</button>
      <p id="msg" style="text-align:center; margin-top:0.5rem;"></p>
    </div>

    <!-- Dashboard (after login) -->
    <div id="dashboard" class="hidden">
      <h2 style="margin-bottom:0.5rem;">Settings</h2>
      <div class="card">
        <label>Max Videos (0 = unlimited)</label>
        <input type="number" id="max_videos" value="0">
      </div>
      <div class="card">
        <h3>YouTube Token</h3>
        <input type="file" id="client_secret_file" accept=".json">
        <button onclick="uploadSecret()">Upload client_secret</button>
        <p id="uploadMsg"></p>
        <input type="text" id="auth_code" placeholder="Paste code here" style="margin-top:0.5rem;">
        <button onclick="authenticate()">Finish Auth</button>
        <p id="authMsg"></p>
        <p>Token status: <span id="tokenStatus" class="badge badge-red">none</span></p>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button onclick="startBot()">▶️ Start</button>
        <button onclick="cancelBot()" style="background:var(--danger);">Cancel</button>
      </div>
      <button onclick="logout()" style="margin-top:1rem;">Logout</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lotfvavhsbxcyduxmaat.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvdGZ2YXZoc2J4Y3lkdXhtYWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODA4MjEsImV4cCI6MjA5NjY1NjgyMX0.zeZwTDpmv_t0b5f07iOb2SP-c7OO8UoiToaLZFCnDvs';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let token = null;

    function msg(text, isError = false) {
      document.getElementById('msg').textContent = text;
      document.getElementById('msg').style.color = isError ? 'var(--danger)' : 'var(--accent)';
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) msg(error.message, true);
      else {
        token = data.session.access_token;
        localStorage.setItem('token', token);
        showDashboard();
      }
    }

    async function signup() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) msg(error.message, true);
      else msg('Signed up! You can now log in.');
    }

    async function showDashboard() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      updateTokenStatus();
    }

    async function logout() {
      await supabase.auth.signOut();
      token = null;
      localStorage.removeItem('token');
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }

    (async () => {
      const saved = localStorage.getItem('token');
      if (saved) {
        const { data: { user } } = await supabase.auth.getUser(saved);
        if (user) { token = saved; showDashboard(); }
        else localStorage.removeItem('token');
      }
    })();

    function apiFetch(url, opts = {}) {
      opts.headers = opts.headers || {};
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      return fetch(url, opts);
    }

    async function uploadSecret() {
      const file = document.getElementById('client_secret_file').files[0];
      if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      const r = await apiFetch('/api/auth/upload_client_secret', { method:'POST', body:fd });
      const d = await r.json();
      if (d.auth_url) {
        document.getElementById('uploadMsg').innerHTML = '✅ <a href="'+d.auth_url+'" target="_blank">Open this URL</a>';
      } else {
        document.getElementById('uploadMsg').textContent = 'Error: ' + (d.error || 'unknown');
      }
    }

    async function authenticate() {
      const code = document.getElementById('auth_code').value.trim();
      const r = await apiFetch('/api/auth/authenticate', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})
      });
      const d = await r.json();
      document.getElementById('authMsg').textContent = d.status === 'authenticated' ? '✅ Token saved' : 'Error: ' + d.error;
      updateTokenStatus();
    }

    async function updateTokenStatus() {
      const r = await apiFetch('/api/auth/status');
      const d = await r.json();
      const el = document.getElementById('tokenStatus');
      if (d.status === 'valid') { el.textContent = 'valid'; el.className = 'badge badge-green'; }
      else { el.textContent = 'none'; el.className = 'badge badge-red'; }
    }

    function startBot() {
      apiFetch('/api/run', { method:'POST' }).then(r => r.json()).then(d => alert(d.message || d.error));
    }
    function cancelBot() {
      apiFetch('/api/cancel', { method:'POST' }).then(r => r.json()).then(d => alert(d.message || d.error));
    }
  </script>
</body>
  </html>
