<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shorts Bot V5.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0a0a1a;
      --surface: rgba(20, 20, 40, 0.75);
      --primary: #7c5dfa;
      --primary-hover: #6a4cf0;
      --accent: #00d4aa;
      --danger: #ff4d6a;
      --text: #eaeaea;
      --muted: #a0a0b0;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(145deg, #0a0a1a 0%, #1a0a2e 100%);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
      align-items: flex-start;
    }
    .container {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 30px 18px 25px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      margin: 10px 0;
    }
    h1, h2, h3 { color: var(--text); }
    input, button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: white;
      padding: 12px 14px;
      font-size: 0.95rem;
      width: 100%;
      transition: 0.2s;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,93,250,0.2); }
    button {
      background: var(--primary);
      border: none;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-top: 10px;
    }
    button:hover { background: var(--primary-hover); }
    .auth-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .auth-overlay h2 {
      margin-bottom: 20px;
      background: linear-gradient(135deg, #7c5dfa, #00d4aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
    }
    .auth-form { width: 100%; max-width: 320px; }
    .auth-form input { margin-bottom: 12px; }
    .auth-buttons { display: flex; gap: 12px; }
    .auth-message { margin-top: 15px; font-size: 0.9rem; }
    .hidden { display: none; }
    /* Rest of the styles from the previous dashboard (unchanged) */
    /* (Include all the other CSS rules for tabs, panels, cards, etc. here) */
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Login / Signup overlay -->
    <div id="auth-overlay" class="auth-overlay">
      <h2>🎬 Shorts Bot</h2>
      <div class="auth-form">
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
        <div class="auth-buttons">
          <button onclick="login()" style="flex:1;">Log In</button>
          <button onclick="signup()" style="flex:1; background: var(--accent);">Sign Up</button>
        </div>
        <p id="auth-message" class="auth-message"></p>
      </div>
    </div>

    <!-- Main dashboard (hidden until login) -->
    <div id="main-panel" class="hidden">
      <!-- Exactly the same dashboard HTML as before (tabs, settings, auth, run, etc.) -->
      <!-- For brevity, I'll note that you must include the full dashboard content here -->
      <!-- The complete dashboard panels can be copied from the earlier full HTML you had -->
      <!-- The only change: replace every `fetch(...)` with `apiFetch(...)` as shown in the script -->
    </div>
  </div>

  <script>
    // ---------- Supabase init ----------
    const SUPABASE_URL = 'https://lotfvavhsbxcyduxmaat.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvdGZ2YXZoc2J4Y3lkdXhtYWF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODA4MjEsImV4cCI6MjA5NjY1NjgyMX0.zeZwTDpmv_t0b5f07iOb2SP-c7OO8UoiToaLZFCnDvs';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authToken = null;

    // ---------- Auth functions ----------
    async function signup() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        document.getElementById('auth-message').textContent = 'Please fill in both fields.';
        return;
      }
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        document.getElementById('auth-message').textContent = error.message;
      } else {
        document.getElementById('auth-message').textContent = '✅ Signup successful! You can now log in.';
      }
    }

    async function login() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) {
        document.getElementById('auth-message').textContent = 'Please fill in both fields.';
        return;
      }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('auth-message').textContent = error.message;
      } else {
        authToken = data.session.access_token;
        localStorage.setItem('authToken', authToken);
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById('auth-overlay').classList.add('hidden');
      document.getElementById('main-panel').classList.remove('hidden');
      // Initialize dashboard (load configs, settings, etc.)
      loadConfigList();
    }

    // Check if already logged in
    (async () => {
      const savedToken = localStorage.getItem('authToken');
      if (savedToken) {
        const { data: { user }, error } = await supabase.auth.getUser(savedToken);
        if (user && !error) {
          authToken = savedToken;
          showDashboard();
        } else {
          localStorage.removeItem('authToken');
        }
      }
    })();

    // ---------- API helper (adds auth header) ----------
    function apiFetch(url, options = {}) {
      options.headers = options.headers || {};
      if (authToken) {
        options.headers['Authorization'] = 'Bearer ' + authToken;
      }
      return fetch(url, options);
    }

    // ---------- All other dashboard functions (unchanged) ----------
    // Replace every `fetch(...)` in your existing dashboard code with `apiFetch(...)`.
    // (The complete set of functions: switchTab, loadConfigList, renderConfigSettings, saveSettings, startBot, cancelBot, etc.)
    // They should be identical to the previous full dashboard, just using apiFetch.

    // Example of a replaced call:
    //   fetch('/api/settings')  →  apiFetch('/api/settings')
    // Apply this change to every fetch in your script.

    // For brevity, I'm not repeating the entire dashboard script here, but you must merge it.
  </script>
</body>
  </html>
